name: kobo2logie
region: nyc

services:
  - name: api
    github:
      repo: kobotoolbox/kobo2logie
      branch: beta
      deploy_on_push: true
    build_command: pip install -r requirements.txt && python manage.py migrate --noinput && python manage.py collectstatic --noinput
    run_command: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    environment_slug: python
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /api
        preserve_path_prefix: true
      - path: /admin
        preserve_path_prefix: true
      - path: /static
        preserve_path_prefix: true
    envs:
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".ondigitalocean.app"
      - key: DEFAULT_KOBO_BASE_URL
        value: "https://kf.kobotoolbox.org"
      - key: MAX_BODY_BYTES
        value: "1048576"
      # Secrets — set via DO web UI after deploy (not stored in app spec):
      # SECRET_KEY, DATABASE_URL,
      # KOBO_API_TOKEN_GLOBAL, KOBO_API_TOKEN_EU,
      # OPENAI_API_KEY, RESEND_API_KEY, RESEND_FROM_EMAIL,
      # LOGIE_API_URL, LOGIE_API_KEY (optional)
    http_port: 8080

databases:
  - name: db
    engine: PG
    version: "16"

static_sites:
  - name: frontend
    github:
      repo: kobotoolbox/kobo2logie
      branch: beta
      deploy_on_push: true
    source_dir: frontend
    build_command: npm install && npm run build
    output_dir: dist
    routes:
      - path: /
    catchall_document: index.html
