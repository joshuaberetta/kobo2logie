name = "kobo2logie"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
DEFAULT_KOBO_BASE_URL = "https://kf.kobotoolbox.org"
MAX_BUFFER_SIZE = "50"
MAX_BODY_BYTES = "1048576"
# RESEND_API_KEY and RESEND_FROM_EMAIL must be set as Worker secrets:
#   wrangler secret put RESEND_API_KEY
#   wrangler secret put RESEND_FROM_EMAIL

[[kv_namespaces]]
binding = "FORWARD_CONFIG"
id = "57e90e5396be420dabba75b6c9093c3e"

[[durable_objects.bindings]]
name = "FORM_SESSION"
class_name = "FormSession"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["FormSession"]
